<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout – Armadio</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" aria-label="Loadout, torna alla home"><img src="/img/logo-topbar.svg" alt="" width="34" height="34"><span>Load<span class="out">out</span></span></a>
    <nav>
      <a href="/armadio.html" title="Armadio"><img src="/img/icone/chiare/armadio.svg" alt="Armadio" width="24" height="24"></a>
      <a href="/viaggi.html" title="Viaggi"><img src="/img/icone/chiare/viaggi.svg" alt="Viaggi" width="24" height="24"></a>
      <a href="/profilo.html" title="Profilo"><img src="/img/icone/chiare/profilo.svg" alt="Profilo" width="24" height="24"></a>
      <a href="#" id="esci" title="Esci"><img src="/img/icone/chiare/esci.svg" alt="Esci" width="24" height="24"></a>
    </nav>
  </header>

  <!-- Testata della pagina: titolo e riepilogo (numero di oggetti e peso totale), e il pulsante + che apre la finestra di inserimento -->
  <section class="testata">
    <div class="testata-dentro con-azione">
      <div>
        <h1>Il mio armadio</h1>
        <p id="riepilogo"></p>
      </div>
      <button type="button" class="pulsante-aggiungi" id="apri-nuovo" aria-label="Nuovo oggetto" title="Nuovo oggetto">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </section>

  <main class="container">
    <!-- La lista degli oggetti, a tutta larghezza -->
    <section class="card">
      <div class="filtri">
        <input type="search" id="q" placeholder="Cerca per nome…" aria-label="Cerca per nome">
        <select id="filtro-categoria" aria-label="Filtra per categoria">
          <option value="">Tutte le categorie</option>
          <option value="abbigliamento">Abbigliamento</option>
          <option value="attrezzatura">Attrezzatura</option>
          <option value="cucina">Cucina</option>
          <option value="sicurezza">Sicurezza</option>
          <option value="igiene">Igiene</option>
          <option value="elettronica">Elettronica</option>
          <option value="cibo">Cibo</option>
          <option value="altro">Altro</option>
        </select>
      </div>
      <div class="tabella-scroll">
        <table id="tabella">
          <thead>
            <tr><th>Nome</th><th>Categoria</th><th>Peso</th><th></th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Finestra (dialog) con il form nuovo / modifica: si apre con il + o cliccando una riga -->
    <dialog class="finestra" id="finestra" aria-labelledby="titolo-form">
      <div class="finestra-contenuto">
      <div class="finestra-testa">
        <h2 id="titolo-form">Nuovo oggetto</h2>
        <button type="button" class="chiudi" id="chiudi" aria-label="Chiudi"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <form id="form-oggetto" novalidate>
        <label>Nome
          <input name="nome" type="text" maxlength="120" required>
        </label>
        <label>Categoria
          <select name="categoria" required>
            <option value="abbigliamento">Abbigliamento</option>
            <option value="attrezzatura">Attrezzatura</option>
            <option value="cucina">Cucina</option>
            <option value="sicurezza">Sicurezza</option>
            <option value="igiene">Igiene</option>
            <option value="elettronica">Elettronica</option>
            <option value="cibo">Cibo</option>
            <option value="altro">Altro</option>
          </select>
        </label>
        <label>Peso (grammi)
          <input name="peso_g" type="number" min="1" step="1" required>
        </label>
        <label class="check"><input name="is_indispensabile" type="checkbox"> Indispensabile</label>
        <label class="check"><input name="is_preferito" type="checkbox"> Preferito</label>
        <label>Codice etichetta
          <input name="codice_etichetta" type="text" maxlength="64">
        </label>
        <label>Note
          <textarea name="note" maxlength="1000" rows="3"></textarea>
        </label>
        <p class="errore" id="form-errore" hidden></p>
        <div class="azioni">
          <button type="submit" id="salva">Salva</button>
          <button type="button" class="secondario" id="annulla">Annulla</button>
        </div>
      </form>
      </div>
    </dialog>
  </main>

  <script type="module" src="/js/armadio.js"></script>
</body>
</html>
