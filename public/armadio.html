<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout – Armadio</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" aria-label="Loadout, torna alla home"><img src="/img/logo-topbar.svg" alt="" width="38" height="38"><span>Load<span class="out">out</span></span></a>
    <!-- Menu: telefono = barra in basso (Viaggi al centro, la scarpa senape); computer = nella barra in alto.
         Consigli: sul computer è l'ultima voce del menu, sul telefono è l'icona accanto a "Esci". -->
    <nav class="menu" aria-label="Navigazione principale">
      <a href="/armadio.html" aria-current="page"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 5.2A1.8 1.8 0 1 1 12 7v1.5"/><path d="M12 8.5 3.6 15a1 1 0 0 0 .6 1.8h15.6a1 1 0 0 0 .6-1.8Z"/><path d="M8 16.8v2.7a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.7"/></svg></span>Armadio</a>
      <a href="/zaini.html"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 5a1.5 1.5 0 0 1 3 0"/><path d="M9 5h6a2 2 0 0 1 2 2l1 12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L7 7a2 2 0 0 1 2-2Z"/><path d="M7.3 9.6C9 11 10.5 11.4 12 11.4s3-.4 4.7-1.8"/><path d="M6.4 15H5.5a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h.6M17.6 15h.9a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-.6"/><path d="M8.5 17.5l2.5-2.5 1.5 1.5 2.5-2.5"/><rect x="11" y="10.4" width="2" height="2.6" rx=".6" fill="#c8962b" stroke="none"/></svg></span>Zaino</a>
      <a href="/viaggi.html" class="menu-centrale" aria-label="Viaggi" title="Viaggi"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h6l.6 5.6 4.9 2.2C19 12 21 13.6 21 16v1H3V5a2 2 0 0 1 2-2Z"/><path d="M3 17v2a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-2"/><path d="M7.5 6.5h3.6M8 10h4.6"/></svg><span class="etichetta-centrale" aria-hidden="true">Viaggi</span></a>
      <a href="/mappe.html"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.4 13.4 8.5 15.5l2.1-4.9Z"/><path d="M14.6 9.4 13 13 11 11Z" fill="#c8962b" stroke="none"/></svg></span>Mappe</a>
      <a href="/profilo.html"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20.5c0-3.9 3.1-7 7-7s7 3.1 7 7"/><rect x="11" y="15.5" width="2" height="2.6" rx=".6" fill="#c8962b" stroke="none"/></svg></span>Profilo</a>
      <a href="/consigli.html" class="solo-computer"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.8C10.2 5.3 7.6 4.6 3.5 4.6v13.2c4.1 0 6.7.7 8.5 2.2 1.8-1.5 4.4-2.2 8.5-2.2V4.6c-4.1 0-6.7.7-8.5 2.2Z"/><path d="M12 6.8V20"/><path d="M15 5.4v4.4l1.3-1 1.3 1V5" fill="#c8962b" stroke="none"/></svg></span>Consigli</a>
    </nav>
    <a href="/consigli.html" class="icona-alto consigli-alto" aria-label="Consigli" title="Consigli"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.8C10.2 5.3 7.6 4.6 3.5 4.6v13.2c4.1 0 6.7.7 8.5 2.2 1.8-1.5 4.4-2.2 8.5-2.2V4.6c-4.1 0-6.7.7-8.5 2.2Z"/><path d="M12 6.8V20"/><path d="M15 5.4v4.4l1.3-1 1.3 1V5" fill="#c8962b" stroke="none"/></svg></a>
    <a href="#" id="esci" class="icona-alto esci" aria-label="Esci" title="Esci"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5H7a2.5 2.5 0 0 0-2.5 2.5v12A2.5 2.5 0 0 0 7 20.5h3"/><path d="M10 12h10"/><path d="M16.5 8.5 20 12l-3.5 3.5"/></svg></a>
  </header>

  <!-- Testata: titolo, riepilogo e i due pulsanti per aggiungere oggetti -->
  <section class="testata">
    <div class="testata-dentro">
      <h1>Il mio armadio</h1>
      <p id="riepilogo"></p>
      <div class="testata-azioni">
        <button type="button" id="apri-nuovo"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Aggiungi</button>
        <!-- Stretch 2: legge il codice a barre con la fotocamera (finestra "Scansiona l'etichetta" qui sotto) -->
        <button type="button" class="su-scuro" id="scansiona"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10"/></svg> Scansiona etichetta</button>
      </div>
    </div>
  </section>

  <main class="container contenuto-stretto">
    <!-- Ricerca e filtro Tutti / Indispensabili / Preferiti -->
    <label class="cerca">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input type="search" id="q" placeholder="Cerca nell'armadio" aria-label="Cerca nell'armadio">
    </label>
    <div class="segmenti" role="group" aria-label="Filtra gli oggetti">
      <button type="button" data-filtro="tutti" aria-pressed="true">Tutti</button>
      <button type="button" data-filtro="indispensabili" aria-pressed="false">Indispensabili</button>
      <button type="button" data-filtro="preferiti" aria-pressed="false">Preferiti</button>
    </div>

    <!-- La lista, divisa per categoria: la riempie armadio.js -->
    <!-- B2 (revisione UX 2): solo mentre cerchi, "1 di 23 oggetti" (la testata mostra sempre il totale dell'armadio) -->
    <p class="muto conteggio-ricerca" id="conteggio-ricerca" hidden></p>
    <div class="gruppi" id="lista"></div>

    <!-- Stretch 2: finestra della fotocamera per leggere il codice a barre dell'etichetta -->
    <dialog class="finestra" id="finestra-scanner" aria-labelledby="titolo-scanner">
      <div class="finestra-contenuto">
        <div class="finestra-testa">
          <h2 id="titolo-scanner">Scansiona l'etichetta</h2>
          <button type="button" class="chiudi" id="chiudi-scanner" aria-label="Chiudi"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <p class="muto">Inquadra il codice a barre dell'etichetta, ben illuminato: si legge da solo.</p>
        <!-- Qui la libreria mette il video della fotocamera -->
        <div class="lettore" id="lettore"></div>
        <p class="stato-scanner" id="stato-scanner" role="status"></p>
        <div class="azioni">
          <button type="button" class="secondario" id="scrivi-a-mano">Scrivi il codice a mano</button>
        </div>
      </div>
    </dialog>

    <!-- Scheda di dettaglio di un oggetto (sola lettura): si apre cliccando un oggetto della lista.
         Da qui si passa a "Modifica" (la finestra con il form) o si elimina. La riempie armadio.js -->
    <dialog class="finestra" id="dettaglio" aria-labelledby="dettaglio-nome">
      <div class="finestra-contenuto">
        <div class="finestra-testa">
          <div class="dettaglio-titolo">
            <span class="riquadro-icona" id="dettaglio-icona"></span>
            <div>
              <h2 id="dettaglio-nome"></h2>
              <p class="muto" id="dettaglio-marchio"></p>
            </div>
          </div>
          <button type="button" class="chiudi" id="chiudi-dettaglio" aria-label="Chiudi"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <p class="avviso" id="dettaglio-nota" hidden></p>
        <div class="riga-dettagli" id="dettaglio-badge"></div>
        <dl class="dati" id="dettaglio-dati"></dl>
        <div class="azioni">
          <button type="button" id="dettaglio-modifica">Modifica</button>
          <button type="button" class="pericolo spinto-a-destra" id="dettaglio-elimina">Elimina</button>
        </div>
      </div>
    </dialog>

    <!-- Finestra (dialog) con il form nuovo / modifica: si apre con Aggiungi, Scansiona o cliccando un oggetto -->
    <dialog class="finestra" id="finestra" aria-labelledby="titolo-form">
      <div class="finestra-contenuto">
        <div class="finestra-testa">
        <h2 id="titolo-form">Nuovo oggetto</h2>
        <button type="button" class="chiudi" id="chiudi" aria-label="Chiudi"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <form id="form-oggetto" novalidate>
        <!-- Messaggio dopo una scansione (es. "Codice letto: …"): in cima, così si vede subito -->
        <p class="avviso" id="form-info" hidden></p>
        <!-- Il codice a barre IN CIMA: se il prodotto si trova, "Cerca" compila i campi qui sotto.
             Il messaggio con l'esito compare subito sopra, quindi si vede sempre. -->
        <div class="campo-con-pulsante">
          <label>Codice a barre <span class="muto">(facoltativo)</span>
            <input name="codice_etichetta" type="text" maxlength="64" inputmode="numeric" placeholder="le cifre sotto le barre">
          </label>
          <button type="button" class="secondario" id="cerca-prodotto">Cerca</button>
        </div>
        <label>Nome
          <input name="nome" type="text" maxlength="120" required>
        </label>
        <label>Categoria
          <select name="categoria" required>
            <option value="" disabled selected>Scegli una categoria…</option>
            <option value="abbigliamento">Abbigliamento</option>
            <option value="attrezzatura">Attrezzatura</option>
            <option value="cucina">Cucina</option>
            <option value="sicurezza">Sicurezza</option>
            <option value="igiene">Igiene</option>
            <option value="elettronica">Elettronica</option>
            <option value="cibo">Cibo</option>
            <option value="altro">Altro</option>
          </select>
        </label>
        <label>Marchio
          <input name="marchio" type="text" maxlength="80" placeholder="es. Salewa">
        </label>
        <div class="riga2">
          <label>Peso (grammi)
            <input name="peso_g" type="number" min="1" step="1" required>
          </label>
          <label>Quanti ne hai
            <input name="quantita_posseduta" type="number" min="1" max="99" step="1" value="1">
          </label>
        </div>
        <label class="check"><input name="is_indispensabile" type="checkbox"> Indispensabile</label>
        <label class="check"><input name="is_preferito" type="checkbox"> Preferito</label>
        <label>Caratteristiche tecniche
          <textarea name="caratteristiche" maxlength="500" rows="2" placeholder="es. Gore-Tex, impermeabile, taglia M"></textarea>
        </label>
        <label>Note
          <textarea name="note" maxlength="1000" rows="3"></textarea>
        </label>
        <p class="errore" id="form-errore" hidden></p>
        <div class="azioni">
          <button type="submit" id="salva">Salva</button>
          <button type="button" class="secondario" id="annulla">Annulla</button>
          <!-- Compare solo in modalità "modifica" -->
          <button type="button" class="pericolo spinto-a-destra" id="elimina-oggetto" hidden>Elimina</button>
        </div>
      </form>
      </div>
    </dialog>
  </main>

  <!-- Stretch 2: libreria per leggere i codici a barre (usa BarcodeDetector del browser dove c'è, altrimenti
       decodifica da sola). Script "classico": crea le variabili globali Html5Qrcode e Html5QrcodeSupportedFormats -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script type="module" src="/js/armadio.js"></script>
</body>
</html>
