<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout – Viaggi</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" aria-label="Loadout, torna alla home"><img src="/img/logo-topbar.svg" alt="" width="38" height="38"><span>Load<span class="out">out</span></span></a>
    <!-- Menu: telefono = barra in basso (Viaggi al centro, la scarpa senape); computer = nella barra in alto.
         Consigli: sul computer è l'ultima voce del menu, sul telefono è l'icona accanto a "Esci". -->
    <nav class="menu" aria-label="Navigazione principale">
      <a href="/armadio.html"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 5.2A1.8 1.8 0 1 1 12 7v1.5"/><path d="M12 8.5 3.6 15a1 1 0 0 0 .6 1.8h15.6a1 1 0 0 0 .6-1.8Z"/><path d="M8 16.8v2.7a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.7"/></svg></span>Armadio</a>
      <a href="/zaini.html"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 5a1.5 1.5 0 0 1 3 0"/><path d="M9 5h6a2 2 0 0 1 2 2l1 12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L7 7a2 2 0 0 1 2-2Z"/><path d="M7.3 9.6C9 11 10.5 11.4 12 11.4s3-.4 4.7-1.8"/><path d="M6.4 15H5.5a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h.6M17.6 15h.9a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-.6"/><path d="M8.5 17.5l2.5-2.5 1.5 1.5 2.5-2.5"/><rect x="11" y="10.4" width="2" height="2.6" rx=".6" fill="#c8962b" stroke="none"/></svg></span>Zaino</a>
      <a href="/viaggi.html" class="menu-centrale" aria-current="page" aria-label="Viaggi" title="Viaggi"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h6l.6 5.6 4.9 2.2C19 12 21 13.6 21 16v1H3V5a2 2 0 0 1 2-2Z"/><path d="M3 17v2a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-2"/><path d="M7.5 6.5h3.6M8 10h4.6"/></svg><span class="etichetta-centrale" aria-hidden="true">Viaggi</span></a>
      <a href="/mappe.html"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.4 13.4 8.5 15.5l2.1-4.9Z"/><path d="M14.6 9.4 13 13 11 11Z" fill="#c8962b" stroke="none"/></svg></span>Mappe</a>
      <a href="/profilo.html"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20.5c0-3.9 3.1-7 7-7s7 3.1 7 7"/><rect x="11" y="15.5" width="2" height="2.6" rx=".6" fill="#c8962b" stroke="none"/></svg></span>Profilo</a>
      <a href="/consigli.html" class="solo-computer"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.8C10.2 5.3 7.6 4.6 3.5 4.6v13.2c4.1 0 6.7.7 8.5 2.2 1.8-1.5 4.4-2.2 8.5-2.2V4.6c-4.1 0-6.7.7-8.5 2.2Z"/><path d="M12 6.8V20"/><path d="M15 5.4v4.4l1.3-1 1.3 1V5" fill="#c8962b" stroke="none"/></svg></span>Consigli</a>
    </nav>
    <a href="/consigli.html" class="icona-alto consigli-alto" aria-label="Consigli" title="Consigli"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.8C10.2 5.3 7.6 4.6 3.5 4.6v13.2c4.1 0 6.7.7 8.5 2.2 1.8-1.5 4.4-2.2 8.5-2.2V4.6c-4.1 0-6.7.7-8.5 2.2Z"/><path d="M12 6.8V20"/><path d="M15 5.4v4.4l1.3-1 1.3 1V5" fill="#c8962b" stroke="none"/></svg></a>
    <a href="#" id="esci" class="icona-alto esci" aria-label="Esci" title="Esci"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5H7a2.5 2.5 0 0 0-2.5 2.5v12A2.5 2.5 0 0 0 7 20.5h3"/><path d="M10 12h10"/><path d="M16.5 8.5 20 12l-3.5 3.5"/></svg></a>
  </header>

  <!-- Testata: titolo, quanti viaggi ci sono e il pulsante per prepararne uno nuovo -->
  <section class="testata">
    <div class="testata-dentro">
      <h1>I miei viaggi</h1>
      <p id="riepilogo"></p>
      <div class="testata-azioni">
        <button type="button" id="apri-nuovo"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Nuovo viaggio</button>
      </div>
    </div>
  </section>

  <main class="container">
    <!-- Filtro: tutti, solo quelli "da fare in futuro", solo quelli già organizzati -->
    <div class="segmenti" id="filtri-viaggi" role="group" aria-label="Filtra i viaggi">
      <button type="button" data-filtro="tutti" aria-pressed="true">Tutti</button>
      <button type="button" data-filtro="da-fare" aria-pressed="false">Da fare</button>
      <button type="button" data-filtro="organizzati" aria-pressed="false">Organizzati</button>
    </div>

    <!-- La lista, divisa in gruppi (in arrivo, senza data, già fatti): la riempie viaggi.js -->
    <div class="gruppi" id="lista"></div>

    <!-- Finestra (dialog) "Prepara il tuo cammino": si apre con il + -->
    <dialog class="finestra" id="finestra" aria-labelledby="titolo-form">
      <div class="finestra-contenuto">
      <div class="finestra-testa">
        <h2><img class="icona" src="/img/icone/percorso.svg" alt="" width="24" height="24"><span id="titolo-form">Prepara il tuo cammino</span></h2>
        <button type="button" class="chiudi" id="chiudi" aria-label="Chiudi"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <form id="form-viaggio" novalidate>
        <label>Nome dell'uscita
          <input name="nome" type="text" maxlength="150" required>
        </label>
        <label>Attività
          <select name="attivita" required>
            <option value="escursione">Escursione / trekking</option>
            <option value="alpinismo">Alpinismo</option>
            <option value="ciaspolata">Ciaspolata</option>
            <option value="ferrata">Ferrata</option>
          </select>
        </label>
        <div class="riga2">
          <label>Persone
            <input name="n_persone" type="number" min="1" max="50" step="1" value="1">
          </label>
          <label>Giorni
            <input name="n_giorni" type="number" min="1" max="60" step="1" value="1">
          </label>
        </div>
        <label>Pernotto
          <select name="pernotto">
            <option value="nessuno">Nessuno (in giornata)</option>
            <option value="rifugio">Rifugio</option>
            <option value="tenda">Tenda</option>
            <option value="bivacco">Bivacco</option>
          </select>
        </label>
        <div class="riga2">
          <label>Data di partenza
            <input name="data_partenza" type="date">
          </label>
          <!-- Mappe, fase 1: serve a stimare a che ora arrivi in vetta (per il meteo lassù) e se parti troppo tardi -->
          <label>Ora di partenza
            <input name="ora_partenza" type="time" value="08:00">
          </label>
        </div>

        <!-- B1: il luogo per nome, con i suggerimenti (OpenStreetMap). Scegliendo un suggerimento
             si compilano anche le coordinate qui sotto (post-it "dal luogo"). -->
        <div class="campo-luogo">
          <label>Da dove parti
            <input name="luogo_partenza" type="text" maxlength="200" required autocomplete="off"
                   placeholder="es. Malga Prato, Rifugio Vajolet, Cortina…"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggerimenti-partenza">
          </label>
          <ul class="suggerimenti" id="suggerimenti-partenza" role="listbox" hidden></ul>
        </div>
        <!-- Le coordinate sono sempre visibili: le compila il luogo, ma quello che scrivi tu vince sempre.
             Se l'uscita ha una mappa diventano non modificabili qui: si cambiano nella pagina della mappa (revisione UX 2) -->
        <p class="muto nota-mappa" hidden>Questi dati vengono dalla mappa: per cambiarli <a class="link-mappa" href="#">apri la mappa</a>.</p>
        <div class="riga2">
          <label><span class="nome-campo">Latitudine partenza <span class="origine"></span></span>
            <input name="lat_partenza" type="number" min="-90" max="90" step="any" placeholder="es. 44.22">
          </label>
          <label><span class="nome-campo">Longitudine partenza <span class="origine"></span></span>
            <input name="lon_partenza" type="number" min="-180" max="180" step="any" placeholder="es. 10.99">
          </label>
        </div>
        <div class="campo-luogo">
          <label>Arrivo <span class="muto">(se diverso)</span>
            <input name="luogo_arrivo" type="text" maxlength="200" autocomplete="off" placeholder="es. Rifugio Lagazuoi"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggerimenti-arrivo">
          </label>
          <ul class="suggerimenti" id="suggerimenti-arrivo" role="listbox" hidden></ul>
        </div>
        <div class="riga2">
          <label><span class="nome-campo">Latitudine arrivo <span class="origine"></span></span>
            <input name="lat_arrivo" type="number" min="-90" max="90" step="any">
          </label>
          <label><span class="nome-campo">Longitudine arrivo <span class="origine"></span></span>
            <input name="lon_arrivo" type="number" min="-180" max="180" step="any">
          </label>
        </div>
        <label class="check"><input name="serve_cucina" type="checkbox"> Serve la cucina</label>

        <details>
          <summary>Percorso (facoltativo)</summary>
          <p class="muto nota-mappa" hidden>Questi dati vengono dalla mappa: per cambiarli <a class="link-mappa" href="#">apri la mappa</a>.</p>
          <!-- Il percorso si può anche disegnare sulla mappa, nella pagina della mappa dell'uscita (dalla scheda: «Disegna la mappa») -->
          <div class="riga2">
            <label>Lunghezza (km)
              <input name="distanza_km" type="number" min="0.1" max="999" step="0.1">
            </label>
            <label>Dislivello positivo (m)
              <input name="dislivello_m" type="number" min="0" max="9000" step="1">
            </label>
          </div>
          <!-- B3: il punto più alto del percorso → meteo in vetta, avviso neve e ghiaccio -->
          <div class="riga2">
            <label>Quota minima (m)
              <input name="quota_min_m" type="number" min="-500" max="9000" step="1" placeholder="es. 900">
            </label>
            <label>Quota massima (m)
              <input name="quota_max_m" type="number" min="0" max="9000" step="1" placeholder="es. 2400">
            </label>
          </div>
          <label>Note
            <textarea name="note" maxlength="1000" rows="2"></textarea>
          </label>
        </details>

        <label class="check"><input name="pianificato" type="checkbox"> <img class="icona" src="/img/icone/da-fare.svg" alt="" width="24" height="24">Percorso da fare in futuro</label>
        <label class="check" id="riga-genera"><input name="genera" type="checkbox" checked> <img class="icona" src="/img/icone/zaino.svg" alt="" width="24" height="24">Genera subito lo zaino</label>
        <p class="errore" id="form-errore" hidden></p>
        <div class="azioni">
          <button type="submit" id="salva">Crea il viaggio</button>
          <button type="button" class="secondario" id="annulla">Annulla</button>
        </div>
      </form>
      </div>
    </dialog>
  </main>

  <script type="module" src="/js/viaggi.js"></script>
</body>
</html>
