<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout – Accedi</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" aria-label="Loadout, torna alla home"><img src="/img/logo-topbar.svg" alt="" width="38" height="38"><span>Load<span class="out">out</span></span></a>
  </header>

  <main>
    <section class="card centrato">
      <img class="benvenuto" src="/img/zaino-pieno-chiaro.svg" alt="" width="96" height="96">
      <h1>Accedi</h1>
      <form id="form-login" novalidate>
        <label>Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="avviso" id="avviso-login" hidden></p>
        <p class="errore" id="errore" hidden></p>
        <button type="submit">Entra</button>
      </form>
      <p class="muto">Non hai un account? <a href="/register.html">Registrati</a></p>
    </section>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
