<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout – Accedi</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <!-- PWA (3/11): l'app installabile. Il manifest dice nome, icone e colori; theme-color colora la barra di stato del telefono -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#31503f">
  <link rel="apple-touch-icon" href="/img/app/icona-180.png"><!-- iPhone: l'icona della schermata Home -->
  <meta name="apple-mobile-web-app-title" content="Loadout">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" aria-label="Loadout, torna alla home"><img src="/img/logo-topbar.svg" alt="" width="38" height="38"><span>Load<span class="out">out</span></span></a>
  </header>

  <main>
    <section class="card centrato">
      <img class="benvenuto" src="/img/zaino-pieno-chiaro.svg" alt="" width="96" height="96">
      <h1>Accedi</h1>
      <!-- C2 (revisione UX 2): una riga per dire cos'è Loadout a chi arriva qui la prima volta -->
      <p class="muto sottotitolo-accesso">Prepara lo zaino giusto per ogni viaggio in montagna</p>
      <form id="form-login" novalidate>
        <label>Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="avviso" id="avviso-login" hidden></p>
        <!-- 4/11: email non ancora confermata: il messaggio e «Rimanda il link» -->
        <div class="avviso da-confermare" id="da-confermare" hidden>
          <span>Prima di entrare conferma la tua email: apri il link che ti abbiamo mandato.</span>
          <button type="button" class="link-bottone" id="rimanda">Rimanda il link</button>
        </div>
        <p class="errore" id="errore" hidden></p>
        <button type="submit">Entra</button>
      </form>
      <!-- 4/11: il recupero della password ora è vero: un link per email (password-dimenticata.html) -->
      <p class="muto"><a href="/password-dimenticata.html">Password dimenticata?</a></p>
      <p class="muto">Non hai un account? <a href="/register.html">Registrati</a></p>
      <!-- 4/11 (privacy): l'informativa, pubblica -->
      <p class="muto"><a href="/privacy.html">Informativa privacy</a> · <a href="/termini.html">Termini d'uso</a></p>
    </section>
    <!-- PWA (3/11): «Installa Loadout sul telefono», solo dove serve (js/pwa.js, collegaRigaInstalla) -->
    <p class="riga-installa" id="riga-installa" hidden></p>
  </main>

  <script type="module" src="/js/mostra-password.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
