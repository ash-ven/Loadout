    <!-- Menu: sul telefono è la barra fissa in basso, sul computer sta qui in alto (vedi style.css) -->

      <a href="/viaggi.html"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h6l.6 5.6 4.9 2.2C19 12 21 13.6 21 16v1H3V5a2 2 0 0 1 2-2Z"/><path d="M3 17v2a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-2"/><path d="M7.5 6.5h3.6M8 10h4.6"/></svg></span>Viaggi</a>
      <a href="/" class="menu-centrale" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 5a1.5 1.5 0 0 1 3 0"/><path d="M9 5h6a2 2 0 0 1 2 2l1 12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L7 7a2 2 0 0 1 2-2Z"/><path d="M7.3 9.6C9 11 10.5 11.4 12 11.4s3-.4 4.7-1.8"/><path d="M6.4 15H5.5a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h.6M17.6 15h.9a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-.6"/><path d="M8.5 17.5l2.5-2.5 1.5 1.5 2.5-2.5"/><rect x="11" y="10.4" width="2" height="2.6" rx=".6" fill="#fbf6ec" stroke="none"/></svg></a>

    <a href="#" id="esci" class="esci" aria-label="Esci" title="Esci"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5H7a2.5 2.5 0 0 0-2.5 2.5v12A2.5 2.5 0 0 0 7 20.5h3"/><path d="M10 12h10"/><path d="M16.5 8.5 20 12l-3.5 3.5"/></svg></a>
  </header>

  <!-- Testata della pagina -->
  <section class="testata">
    <div class="testata-dentro stretta">
      <h1>Il tuo profilo</h1>
      <p>I tuoi dati e il peso che Loadout usa per l'avviso sullo zaino.</p>
    </div>
  </section>

  <main class="container stretta">
    <!-- I dati dell'account: solo lettura (l'API non permette di cambiare nome ed email) -->
    <section class="card">
      <h2><img class="icona" src="/img/icone/profilo.svg" alt="" width="24" height="24">Account</h2>
      <dl class="dati">
        <dt>Nome</dt>
        <dd id="nome">…</dd>
        <dt>Email</dt>
        <dd id="email">…</dd>
      </dl>
      <button type="button" class="secondario" id="bottone-esci">Esci dall'account</button>
    </section>

    <!-- Peso corporeo e soglia dello zaino (stretch 5) -->
    <section class="card">
      <h2><img class="icona" src="/img/icone/avviso-peso.svg" alt="" width="24" height="24">Peso corporeo</h2>
      <p class="muto">Lo zaino non dovrebbe superare il 20% del tuo peso. Con il peso impostato, Loadout ti avvisa nella scheda di ogni viaggio.</p>
      <form id="form-profilo" class="aggiungi" novalidate>
        <label>Peso corporeo (kg)
          <input name="peso_corporeo_kg" type="number" min="20" max="300" step="0.1">
        </label>
        <button type="submit">Salva</button>
      </form>
      <p class="avviso" id="profilo-info" hidden></p>
      <p class="errore" id="profilo-errore" hidden></p>
    </section>
  </main>

  <script type="module" src="/js/profilo.js"></script>
</body>
</html>
