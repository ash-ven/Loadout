<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout – Conferma dell'email</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <!-- PWA (3/11): l'app installabile. Il manifest dice nome, icone e colori; theme-color colora la barra di stato del telefono -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#31503f">
  <link rel="apple-touch-icon" href="/img/app/icona-180.png"><!-- iPhone: l'icona della schermata Home -->
  <meta name="apple-mobile-web-app-title" content="Loadout">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" aria-label="Loadout, torna alla home"><img src="/img/logo-topbar.svg" alt="" width="38" height="38"><span>Load<span class="out">out</span></span></a>
  </header>

  <main>
    <!-- 4/11: il link dell'email di conferma apre questa pagina (?codice=…); la pagina manda il codice al server con POST
         (un GET dal link lo "userebbero" anche i programmi che controllano i link delle email) -->
    <section class="card centrato">
      <img class="benvenuto" src="/img/zaino-pieno-chiaro.svg" alt="" width="96" height="96">
      <h1>Conferma dell'email</h1>
      <p class="muto" id="stato-conferma" role="status">Sto confermando…</p>
      <p class="errore" id="errore" hidden></p>
      <p id="azioni-conferma" hidden><a class="btn" href="/login.html">Vai all'accesso</a></p>
    </section>
  </main>

  <script type="module" src="/js/conferma-email.js"></script>
</body>
</html>
