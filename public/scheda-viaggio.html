<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout – Scheda viaggio</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" aria-label="Loadout, torna alla home"><img src="/img/logo-topbar.svg" alt="" width="38" height="38"><span>Load<span class="out">out</span></span></a>
    <!-- Menu: sul telefono è la barra fissa in basso, sul computer sta qui in alto (vedi style.css) -->
    <nav class="menu" aria-label="Navigazione principale">
      <a href="/armadio.html"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 5.2A1.8 1.8 0 1 1 12 7v1.5"/><path d="M12 8.5 3.6 15a1 1 0 0 0 .6 1.8h15.6a1 1 0 0 0 .6-1.8Z"/><path d="M8 16.8v2.7a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.7"/></svg></span>Armadio</a>
      <a href="/viaggi.html" aria-current="page"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h6l.6 5.6 4.9 2.2C19 12 21 13.6 21 16v1H3V5a2 2 0 0 1 2-2Z"/><path d="M3 17v2a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-2"/><path d="M7.5 6.5h3.6M8 10h4.6"/></svg></span>Viaggi</a>
      <a href="/" class="menu-centrale" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 5a1.5 1.5 0 0 1 3 0"/><path d="M9 5h6a2 2 0 0 1 2 2l1 12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L7 7a2 2 0 0 1 2-2Z"/><path d="M7.3 9.6C9 11 10.5 11.4 12 11.4s3-.4 4.7-1.8"/><path d="M6.4 15H5.5a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h.6M17.6 15h.9a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-.6"/><path d="M8.5 17.5l2.5-2.5 1.5 1.5 2.5-2.5"/><rect x="11" y="10.4" width="2" height="2.6" rx=".6" fill="#fbf6ec" stroke="none"/></svg></a>
      <a href="/consigli.html"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.4 13.4 8.5 15.5l2.1-4.9Z"/><path d="M14.6 9.4 13 13 11 11Z" fill="#c8962b" stroke="none"/></svg></span>Consigli</a>
      <a href="/profilo.html"><span class="menu-icona"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20.5c0-3.9 3.1-7 7-7s7 3.1 7 7"/><rect x="11" y="15.5" width="2" height="2.6" rx=".6" fill="#c8962b" stroke="none"/></svg></span>Profilo</a>
    </nav>
    <a href="#" id="esci" class="esci" aria-label="Esci" title="Esci"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5H7a2.5 2.5 0 0 0-2.5 2.5v12A2.5 2.5 0 0 0 7 20.5h3"/><path d="M10 12h10"/><path d="M16.5 8.5 20 12l-3.5 3.5"/></svg></a>
  </header>

  <!-- Testata: i dati del viaggio (nascosta finché non arrivano) -->
  <section class="testata" id="intestazione" hidden>
    <div class="testata-dentro">
      <p class="indietro"><a href="/viaggi.html">← I miei viaggi</a></p>
      <h1 id="titolo"></h1>
      <div class="etichette" id="dettagli"></div>
      <div class="testata-azioni">
        <button type="button" class="su-scuro" id="elimina-viaggio">Elimina viaggio</button>
      </div>
    </div>
  </section>

  <main class="container">
    <!-- Indicatore di caricamento: compare solo se i dati tardano (vedi AVVIO in scheda-viaggio.js) -->
    <div class="caricamento" id="caricamento" hidden>
      <img src="/img/zaino-animato-chiaro.svg" alt="" width="120" height="120">
      <p class="muto" role="status">Sto preparando lo zaino…</p>
    </div>

    <div class="griglia due-colonne" id="corpo-scheda" hidden>
      <!-- Colonna sinistra: lo zaino -->
      <div class="colonna-zaino">
        <section class="card">
          <div class="intestazione-sezione">
            <h2><img class="icona" src="/img/icone/zaino.svg" alt="" width="24" height="24">Il tuo zaino</h2>
            <div class="azioni">
              <button type="button" id="genera">Genera zaino</button>
              <button type="button" class="secondario" id="svuota">Svuota checklist</button>
            </div>
          </div>
          <p><strong id="peso-inserito">0,00</strong> kg già nello zaino su <strong id="peso-totale">0,00</strong> kg previsti</p>
          <div class="barra"><div id="barra-riempimento"></div></div>
          <p class="avviso" id="avviso-peso" hidden><img class="icona" src="/img/icone/avviso-peso.svg" alt="" width="24" height="24"><span id="testo-avviso-peso"></span></p>
          <p class="muto" id="messaggio-zaino" hidden></p>
          <p class="errore" id="errore-zaino" hidden></p>
        </section>

        <!-- La checklist, divisa per categoria come l'armadio: la riempie scheda-viaggio.js -->
        <div class="gruppi una-colonna" id="checklist"></div>

        <section class="card">
          <h3>Aggiungi dall'armadio</h3>
          <form id="form-aggiungi" class="aggiungi">
            <select name="oggetto_id" aria-label="Oggetto dall'armadio"></select>
            <input name="quantita" type="number" min="1" max="99" step="1" value="1" aria-label="Quantità">
            <button type="submit">Aggiungi</button>
          </form>
        </section>
      </div>

      <!-- Colonna destra: i consigli -->
      <section class="card">
        <h2><img class="icona" src="/img/icone/consigli.svg" alt="" width="24" height="24">Consigli per il viaggio</h2>
        <div class="consiglio">
          <h3><img class="icona" src="/img/icone/acqua.svg" alt="" width="24" height="24">Acqua</h3>
          <p id="acqua"></p>
          <form id="form-ore" class="aggiungi">
            <label>Ore di cammino al giorno
              <input name="ore" type="number" min="0.5" max="16" step="0.5">
            </label>
            <button type="submit" class="secondario">Ricalcola</button>
          </form>
        </div>
        <div class="consiglio">
          <h3><img class="icona" src="/img/icone/sole.svg" alt="" width="24" height="24">Alba e tramonto</h3>
          <p id="sole"></p>
        </div>
        <div class="consiglio">
          <h3><img class="icona" src="/img/icone/meteo.svg" alt="" width="24" height="24">Meteo</h3>
          <div id="meteo"></div>
        </div>
        <div class="consiglio">
          <h3><img class="icona" src="/img/icone/percorso.svg" alt="" width="24" height="24">Percorso</h3>
          <p id="percorso"></p>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/js/scheda-viaggio.js"></script>
</body>
</html>
