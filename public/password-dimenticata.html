<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout – Password dimenticata</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <!-- PWA (3/11): l'app installabile. Il manifest dice nome, icone e colori; theme-color colora la barra di stato del telefono -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#31503f">
  <link rel="apple-touch-icon" href="/img/app/icona-180.png"><!-- iPhone: l'icona della schermata Home -->
  <meta name="apple-mobile-web-app-title" content="Loadout">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" aria-label="Loadout, torna alla home"><img src="/img/logo-topbar.svg" alt="" width="38" height="38"><span>Load<span class="out">out</span></span></a>
  </header>

  <main>
    <!-- 4/11: «Password dimenticata?». La risposta è sempre la stessa, che l'email sia registrata o no -->
    <section class="card centrato">
      <img class="benvenuto" src="/img/zaino-pieno-chiaro.svg" alt="" width="96" height="96">
      <h1>Password dimenticata</h1>
      <p class="muto sottotitolo-accesso">Ti mandiamo un link per sceglierne una nuova.</p>
      <form id="form-dimenticata" novalidate>
        <label>Email
          <input name="email" type="email" autocomplete="email" maxlength="255" required>
        </label>
        <p class="avviso" id="avviso" role="status" hidden></p>
        <p class="errore" id="errore" hidden></p>
        <button type="submit">Mandami il link</button>
      </form>
      <p class="muto"><a href="/login.html">Torna all'accesso</a></p>
    </section>
  </main>

  <script type="module" src="/js/password-dimenticata.js"></script>
</body>
</html>
