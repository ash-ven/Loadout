<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout – Nuova password</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <!-- PWA (3/11): l'app installabile. Il manifest dice nome, icone e colori; theme-color colora la barra di stato del telefono -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#31503f">
  <link rel="apple-touch-icon" href="/img/app/icona-180.png"><!-- iPhone: l'icona della schermata Home -->
  <meta name="apple-mobile-web-app-title" content="Loadout">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" aria-label="Loadout, torna alla home"><img src="/img/logo-topbar.svg" alt="" width="38" height="38"><span>Load<span class="out">out</span></span></a>
  </header>

  <main>
    <!-- 4/11: il link dell'email «password dimenticata» apre questa pagina (?codice=…) -->
    <section class="card centrato">
      <img class="benvenuto" src="/img/zaino-pieno-chiaro.svg" alt="" width="96" height="96">
      <h1>Nuova password</h1>
      <form id="form-nuova" novalidate>
        <label>Nuova password (almeno 8 caratteri)
          <input name="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>Ripeti la nuova password
          <input name="ripeti" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <p class="errore" id="errore" hidden></p>
        <button type="submit">Salva la password</button>
      </form>
      <p class="muto"><a href="/password-dimenticata.html">Chiedi un link nuovo</a></p>
    </section>
  </main>

  <script type="module" src="/js/mostra-password.js"></script>
  <script type="module" src="/js/nuova-password.js"></script>
</body>
</html>
