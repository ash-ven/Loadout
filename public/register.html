<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout – Registrati</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <!-- PWA (3/11): l'app installabile. Il manifest dice nome, icone e colori; theme-color colora la barra di stato del telefono -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#31503f">
  <link rel="apple-touch-icon" href="/img/app/icona-180.png"><!-- iPhone: l'icona della schermata Home -->
  <meta name="apple-mobile-web-app-title" content="Loadout">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/" aria-label="Loadout, torna alla home"><img src="/img/logo-topbar.svg" alt="" width="38" height="38"><span>Load<span class="out">out</span></span></a>
  </header>

  <main>
    <section class="card centrato">
      <img class="benvenuto" src="/img/zaino-pieno-chiaro.svg" alt="" width="96" height="96">
      <h1>Crea il tuo account</h1>
      <form id="form-register" novalidate>
        <!-- 4/11 (Asiha): «Username», con l'esempio. autocomplete="nickname" e non "given-name" o "username":
             con quelli alcuni browser riempivano il campo con l'email, e la Home salutava «Ciao, nome@gmail.com!» -->
        <label>Username
          <input name="nome" type="text" autocomplete="nickname" maxlength="100" required placeholder="Come vuoi che ti chiamiamo?">
        </label>
        <label>Email
          <input name="email" type="email" autocomplete="email" maxlength="255" required>
        </label>
        <label>Password (almeno 8 caratteri)
          <input name="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <p class="errore" id="errore" hidden></p>
        <!-- 4/11 (privacy): l'informativa al momento della raccolta dei dati (GDPR, art. 13) ed età minima di 14 anni.
             Non è una casella da spuntare: per il servizio base non serve il consenso. Si apre in un'altra scheda per non perdere il form -->
        <p class="muto nota-registrazione">Registrandoti accetti i <a href="/termini.html" target="_blank" rel="noopener">Termini d'uso</a>, confermi di avere almeno 14 anni e di aver letto l'<a href="/privacy.html" target="_blank" rel="noopener">informativa privacy</a>.</p><!-- 5/11: + Termini d'uso -->
        <button type="submit">Registrati</button>
      </form>
      <!-- 4/11: dopo la registrazione, al posto del form -->
      <div class="avviso registrata" id="registrata" tabindex="-1" role="status" hidden>
        <span>Ti abbiamo scritto a <strong></strong>: apri il link nell'email per attivare l'account (controlla anche lo spam).</span>
      </div>
      <p class="muto">Hai già un account? <a href="/login.html">Accedi</a></p>
    </section>
    <!-- PWA (3/11): «Installa Loadout sul telefono», solo dove serve (js/pwa.js, collegaRigaInstalla) -->
    <p class="riga-installa" id="riga-installa" hidden></p>
  </main>

  <script type="module" src="/js/mostra-password.js"></script>
  <script type="module" src="/js/register.js"></script>
</body>
</html>
